databases:
  - name: holdem-db
    plan: free
    databaseName: holdem

services:
  - type: keyvalue
    name: holdem-redis
    plan: free
    ipAllowList: []

  - type: web
    name: holdem-poker
    runtime: docker
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: holdem-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: holdem-redis
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
